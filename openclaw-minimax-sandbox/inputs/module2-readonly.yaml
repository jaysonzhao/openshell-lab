version: 1
filesystem_policy:
  include_workdir: false
  read_only:
  - /bin
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /app
  - /etc
  - /var/log
  - /opt
  read_write:
  - /sandbox
  - /tmp
  - /dev/null
landlock:
  compatibility: hard_requirement
network_policies:
  github_api:
    endpoints:
    - host: api.github.com
      port: 443
      protocol: rest
      access: read-only
      enforcement: enforce
    binaries:
    - path: /usr/bin/curl
