{{- if .Values.contentSafety.deploy }}
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-nemoguard-runtime
  annotations:
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    opendatahub.io/template-display-name: vLLM ServingRuntime for NemoGuard
    openshift.io/display-name: vLLM ServingRuntime for NemoGuard
  labels:
    {{- include "nemo-guardrails.labels" . | nindent 4 }}
    opendatahub.io/dashboard: 'true'
spec:
  annotations:
    prometheus.io/port: '8080'
    prometheus.io/path: '/metrics'
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
  containers:
    - name: kserve-container
      image: {{ .Values.contentSafety.runtime.image }}
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - "--port=8080"
        - "--model=/mnt/models"
        - "--served-model-name={{`{{.Name}}`}}"
        - "--gpu-memory-utilization=0.95"
      ports:
        - containerPort: 8080
          protocol: TCP
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: content-safety-detector
  labels:
    {{- include "nemo-guardrails.labels" . | nindent 4 }}
    opendatahub.io/dashboard: 'true'
    kueue.x-k8s.io/queue-name: unreserved
  annotations:
    openshift.io/display-name: content-safety-detector
    serving.knative.openshift.io/enablePassthrough: 'true'
    sidecar.istio.io/inject: 'true'
    security.opendatahub.io/enable-auth: 'false'
    sidecar.istio.io/rewriteAppHTTPProbers: 'true'
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    maxReplicas: 1
    minReplicas: 1
    {{- with .Values.contentSafety.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    model:
      modelFormat:
        name: vLLM
      name: ''
      resources:
        limits:
          cpu: '2'
          memory: 8Gi
          {{ .Values.contentSafety.gpu.resourceType }}: {{ .Values.contentSafety.gpu.count | quote }}
        requests:
          cpu: '2'
          memory: 8Gi
          {{ .Values.contentSafety.gpu.resourceType }}: {{ .Values.contentSafety.gpu.count | quote }}
      runtime: vllm-nemoguard-runtime
      storageUri: {{ .Values.contentSafety.modelUri }}
{{- end }}
