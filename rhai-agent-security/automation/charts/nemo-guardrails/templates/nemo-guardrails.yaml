---
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "nemo-guardrails.labels" . | nindent 4 }}
spec:
  replicas: 1
  nemoConfigs:
    - name: {{ .Values.name }}-config
      configMaps:
        - {{ .Values.name }}-config
  env:
    - name: PYTHONHTTPSVERIFY
      value: "0"
    - name: MAIN_MODEL_BASE_URL
      value: {{ .Values.llm.baseUrl | quote }}
    - name: MAIN_MODEL_ENGINE
      value: {{ .Values.llm.engine | quote }}
    {{- if .Values.llm.apiKeySecretName }}
    - name: {{ .Values.llm.apiKeyEnvVar }}
      valueFrom:
        secretKeyRef:
          name: {{ .Values.llm.apiKeySecretName }}
          key: api-key
    {{- else if .Values.llm.apiKey }}
    - name: {{ .Values.llm.apiKeyEnvVar }}
      value: {{ .Values.llm.apiKey | quote }}
    {{- else }}
    - name: OPENAI_API_KEY
      value: "unused"
    {{- end }}
    {{- if and .Values.llamaGuard.enabled .Values.llamaGuard.apiKey }}
    - name: {{ .Values.llamaGuard.apiKeyEnvVar }}
      value: {{ .Values.llamaGuard.apiKey | quote }}
    {{- end }}
