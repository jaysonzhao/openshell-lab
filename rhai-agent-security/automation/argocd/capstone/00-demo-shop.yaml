# Module 7 prerequisite: the demo shop the fleet investigates.
# Sync wave 0 — namespace and workload first.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    app.kubernetes.io/part-of: sre-copilot-capstone
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: demo
  labels:
    app: shop
    app.kubernetes.io/part-of: sre-copilot-capstone
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 2
  selector:
    matchLabels: { app: shop }
  template:
    metadata:
      labels: { app: shop }
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:stable
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: demo
  labels:
    app: shop
    app.kubernetes.io/part-of: sre-copilot-capstone
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector: { app: shop }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
