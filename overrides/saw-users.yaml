# Add real account names here after creating them with keycloak-add-users.
# Each entry creates saw-<name>. Demo entries are in saw-users-demo.yaml.
users:
  - name: alice
    pruneOnRemove: true
    profiles:
      - custom-inference
    vaultPrefix: secret/data/hub/saw-alice
  - name: bob
    profiles:
      - custom-inference
    vaultPrefix: secret/data/hub/saw-bob

ownerResolution:
  resolverNamespace: keycloak

defaults:
  openshellSaw:
    oidc:
      keycloakNamespace: keycloak
    networkPolicy:
      enabled: true
      clusterNetworkCIDRs:
        - 10.232.0.0/14
      serviceNetworkCIDRs:
        - 172.231.0.0/16
    egress:
      extraAllow:
        - api.minimax.io
    source:
      dataSource: openshell-gateway
      dataSourceNamespace: openshell-agents
    credentialProxy:
      image: image-registry.openshift-image-registry.svc:5000/openshell-agents/saw-credential-proxy@sha256:cc4fb0ba0a828869ec4b954083f32d1ae425d3f62a2e2c255b00925513d41d54
    cleanupApi:
      serviceIP: 172.231.0.1
      endpoints:
        - ip: 10.10.10.10
          port: 6443
