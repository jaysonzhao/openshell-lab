{{- /* Red Hat Developer Hub, configured for the agent workspace portal. */ -}}
apiVersion: {{ include "openshell-rhdh.backstageApiVersion" . }}
kind: Backstage
metadata:
  name: {{ .Values.rhdh.name }}
  namespace: {{ .Values.rhdh.namespace }}
  labels:
    {{- include "openshell-rhdh.labels" . | nindent 4 }}
spec:
  application:
    appConfig:
      configMaps:
        - name: saw-rhdh-app-config
    dynamicPluginsConfigMapName: saw-rhdh-dynamic-plugins
    extraEnvs:
      envs:
        - name: NODE_OPTIONS
          value: "--no-node-snapshot"
        {{- if .Values.tls.insecureSkipVerify }}
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        {{- else }}
        # Node keeps its own CAs and adds these: the cluster's and the
        # router's (Keycloak), the Kubernetes API's (the proxy endpoints).
        - name: NODE_EXTRA_CA_CERTS
          value: /opt/saw-ca/ca-bundle.crt
        {{- end }}
      secrets:
        # AUTH_OIDC_CLIENT_SECRET, SESSION_SECRET (from Vault)
        - name: rhdh-oidc
        # `token`: the rhdh-portal service account's token for the proxy
        # endpoints (see saw-rhdh-app-config).
        - name: rhdh-portal-token
          key: token
    extraFiles:
      mountPath: /opt/app-root/src/saw
      configMaps:
        - name: saw-rhdh-templates
        {{- if .Values.rhdh.rbac.enabled }}
        - name: saw-rhdh-rbac
        {{- end }}
      {{- if .Values.rhdh.tekton.enabled }}
      secrets:
        # `token` of rhdh-kubernetes-reader, read by the Kubernetes plugin
        # ($file in saw-rhdh-app-config).
        - name: rhdh-kubernetes-reader-token
          key: token
      {{- end }}
    route:
      enabled: true
      {{- if .Values.rhdh.host }}
      host: {{ .Values.rhdh.host }}
      {{- end }}
  deployment:
    patch:
      spec:
        template:
          spec:
            initContainers:
              - name: install-dynamic-plugins
                resources:
                  requests:
                    ephemeral-storage: {{ .Values.rhdh.persistence.ephemeralStorageRequest | quote }}
                  limits:
                    ephemeral-storage: {{ .Values.rhdh.persistence.ephemeralStorageLimit | quote }}
              - name: init-rag-data
                command:
                  - sh
                  - -c
                  - |
                    if [ ! -d /data/embeddings_model ]; then
                      echo 'Seeding RAG data...'
                      cp -r --no-preserve=mode,ownership /rag/. /data/
                    fi
                    mkdir -p /data/vector_db/notebooks
                    chmod -R a+rwX /data/embeddings_model /data/vector_db
              {{- if not .Values.tls.insecureSkipVerify }}
              # Build the CA bundle before RHDH starts.
              {{- include "openshell-rhdh.caInitContainer" . | nindent 14 }}
              {{- end }}
            containers:
              - name: backstage-backend
                resources:
                  requests:
                    ephemeral-storage: {{ .Values.rhdh.persistence.ephemeralStorageRequest | quote }}
                  limits:
                    ephemeral-storage: {{ .Values.rhdh.persistence.ephemeralStorageLimit | quote }}
                {{- if not .Values.tls.insecureSkipVerify }}
                volumeMounts:
                  - name: saw-ca
                    mountPath: /opt/saw-ca
                    readOnly: true
                {{- end }}
              - name: lightspeed-core
                resources:
                  requests:
                    ephemeral-storage: {{ .Values.rhdh.persistence.ephemeralStorageRequest | quote }}
                  limits:
                    ephemeral-storage: {{ .Values.rhdh.persistence.ephemeralStorageLimit | quote }}
            volumes:
              - $patch: replace
                name: extensions-catalog
                persistentVolumeClaim:
                  claimName: {{ printf "%s-extensions-catalog" .Values.rhdh.name | trunc 63 | trimSuffix "-" }}
              - $patch: replace
                name: npmcacache
                persistentVolumeClaim:
                  claimName: {{ printf "%s-npmcacache" .Values.rhdh.name | trunc 63 | trimSuffix "-" }}
              - $patch: replace
                name: temp
                persistentVolumeClaim:
                  claimName: {{ printf "%s-temp" .Values.rhdh.name | trunc 63 | trimSuffix "-" }}
              - $patch: replace
                name: shared-storage
                persistentVolumeClaim:
                  claimName: {{ printf "%s-shared-storage" .Values.rhdh.name | trunc 63 | trimSuffix "-" }}
              - $patch: replace
                name: rag-data-volume
                persistentVolumeClaim:
                  claimName: {{ printf "%s-rag-data-volume" .Values.rhdh.name | trunc 63 | trimSuffix "-" }}
              - $patch: replace
                name: saw-ca
                persistentVolumeClaim:
                  claimName: {{ printf "%s-saw-ca" .Values.rhdh.name | trunc 63 | trimSuffix "-" }}
              {{- if not .Values.tls.insecureSkipVerify }}
              {{- include "openshell-rhdh.caVolumes" . | nindent 14 }}
              {{- end }}
  database:
    enableLocalDb: true
