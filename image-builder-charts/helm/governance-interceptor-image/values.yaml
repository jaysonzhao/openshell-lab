source:
  git:
    uri: "https://github.com/NVIDIA/OpenShell.git"
    ref: "v0.1.2"

build:
  contextDir: "examples/governance-interceptor"
  # OpenShell 0.1.x needs Rust 1.94 (rust-version in its Cargo.toml).
  builderImage: "rust@sha256:6ae102bdbf528294bc79ad6e1fae682f6f7c2a6e6621506ba959f9685b308a55"
  runtimeImage: "registry.access.redhat.com/ubi9-micro@sha256:5be877a2a280ae36eb9ab80ca4efb28bbf77c57abbba38137cdc37a03b8465e6"
  # Shared Dockerfile stage with Debian and its CA certificates installed.
  ghcrRuntimeImage: "debian-runtime"

output:
  # One tag per OpenShell release. The interceptor must match the gateway
  # (0.1.x negotiates PeerMetadata), and pushing :latest would change the
  # interceptor under SAWs still on another release.
  externalImage: ""
  pushSecretName: "ghcr-push-secret"
  # Build into the internal registry by default. To publish elsewhere, clear
  # this and explicitly set externalImage plus pushSecretName.
  imageStreamTag: "governance-interceptor:v0.1.2"
