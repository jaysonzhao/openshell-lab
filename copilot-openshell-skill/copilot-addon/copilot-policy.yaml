version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /etc
  - /var/log
  - /opt
  read_write:
  - /sandbox
  - /tmp
  - /dev/null
landlock:
  compatibility: hard_requirement
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  copilot-service:
    name: copilot-service
    endpoints:
    - host: api.individual.githubcopilot.com
      port: 443
      protocol: rest
      tls: terminate
      access: read-write
      enforcement: enforce
    binaries:
    - path: /usr/bin/copilot
    - path: /usr/lib/node_modules/@github/copilot/node_modules/@github/copilot-linux-x64/copilot
  copilot-auth:
    name: copilot-auth
    endpoints:
    - host: api.github.com
      port: 443
      protocol: rest
      tls: terminate
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /user
      - allow:
          method: GET
          path: /copilot_internal/**
    binaries:
    - path: /usr/bin/copilot
    - path: /usr/lib/node_modules/@github/copilot/node_modules/@github/copilot-linux-x64/copilot
  copilot-service-bootstrap:
    name: copilot-service-bootstrap
    endpoints:
    - host: api.githubcopilot.com
      port: 443
      protocol: rest
      tls: terminate
      access: read-write
      enforcement: enforce
    binaries:
    - path: /usr/bin/copilot
    - path: /usr/lib/node_modules/@github/copilot/node_modules/@github/copilot-linux-x64/copilot
